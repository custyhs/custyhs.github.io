- id: chen2024risk
  title: "Provable Risk-Sensitive Distributional Reinforcement Learning with General Function Approximation"
  authors: ["Yu Chen*", "Xiangcheng Zhang*", "Siwei Wang", "Longbo Huang"]
  year: 2024
  kind: publication
  venue: ICML
  venue_full: "Forty-first International Conference on Machine Learning"
  topics: [risk-sensitive, function-approximation]
  links:
    - { label: Paper, url: "https://openreview.net/forum?id=0xmfExPqFf", kind: paper }
    - { label: arXiv, url: "https://arxiv.org/abs/2402.18159", kind: arxiv }
  bibtex: |
    @InProceedings{pmlr-v235-chen24bf,
      title = 	 {Provable Risk-Sensitive Distributional Reinforcement Learning with General Function Approximation},
      author =       {Chen, Yu and Zhang, Xiangcheng and Wang, Siwei and Huang, Longbo},
      booktitle = 	 {Proceedings of the 41st International Conference on Machine Learning},
      pages = 	 {7748--7791},
      year = 	 {2024},
      editor = 	 {Salakhutdinov, Ruslan and Kolter, Zico and Heller, Katherine and Weller, Adrian and Oliver, Nuria and Scarlett, Jonathan and Berkenkamp, Felix},
      volume = 	 {235},
      series = 	 {Proceedings of Machine Learning Research},
      month = 	 {21--27 Jul},
      publisher =    {PMLR},
      pdf = 	 {https://raw.githubusercontent.com/mlresearch/v235/main/assets/chen24bf/chen24bf.pdf},
      url = 	 {https://proceedings.mlr.press/v235/chen24bf.html},
      abstract = 	 {In the realm of reinforcement learning (RL), accounting for risk is crucial for making decisions under uncertainty, particularly in applications where safety and reliability are paramount. In this paper, we introduce a general framework on Risk-Sensitive Distributional Reinforcement Learning (RS-DisRL), with static Lipschitz Risk Measures (LRM) and general function approximation. Our framework covers a broad class of risk-sensitive RL, and facilitates analysis of the impact of estimation functions on the effectiveness of RSRL strategies and evaluation of their sample complexity. We design two innovative meta-algorithms: RS-DisRL-M, a model-based strategy for model-based function approximation, and RS-DisRL-V, a model-free approach for general value function approximation. With our novel estimation techniques via Least Squares Regression (LSR) and Maximum Likelihood Estimation (MLE) in distributional RL with augmented Markov Decision Process (MDP), we derive the first $\widetilde{\mathcal{O}}(\sqrt{K})$ dependency of the regret upper bound for RSRL with static LRM, marking a pioneering contribution towards statistically efficient algorithms in this domain.}
    }

- id: zhang2024pomdp
  title: "Provably Efficient Partially Observable Risk-Sensitive Reinforcement Learning with Hindsight Observation"
  authors: ["Tonghe Zhang*", "Yu Chen*", "Longbo Huang"]
  year: 2024
  kind: publication
  venue: ICML
  venue_full: "Forty-first International Conference on Machine Learning"
  topics: [risk-sensitive]
  links:
    - { label: Paper, url: "https://openreview.net/forum?id=5S8ukkEQr2", kind: paper }
    - { label: arXiv, url: "https://arxiv.org/abs/2402.18149", kind: arxiv }
  bibtex: |
    @InProceedings{pmlr-v235-zhang24g,
      title = 	 {Provably Efficient Partially Observable Risk-sensitive Reinforcement Learning with Hindsight Observation},
      author =       {Zhang, Tonghe and Chen, Yu and Huang, Longbo},
      booktitle = 	 {Proceedings of the 41st International Conference on Machine Learning},
      pages = 	 {58680--58716},
      year = 	 {2024},
      editor = 	 {Salakhutdinov, Ruslan and Kolter, Zico and Heller, Katherine and Weller, Adrian and Oliver, Nuria and Scarlett, Jonathan and Berkenkamp, Felix},
      volume = 	 {235},
      series = 	 {Proceedings of Machine Learning Research},
      month = 	 {21--27 Jul},
      publisher =    {PMLR},
      pdf = 	 {https://raw.githubusercontent.com/mlresearch/v235/main/assets/zhang24g/zhang24g.pdf},
      url = 	 {https://proceedings.mlr.press/v235/zhang24g.html},
      abstract = 	 {This work pioneers regret analysis of risk-sensitive reinforcement learning in partially observable environments with hindsight observation, addressing a gap in theoretical exploration. We introduce a novel formulation that integrates hindsight observations into a Partially Observable Markov Decision Process (POMDP) framework, where the goal is to optimize accumulated reward under the entropic risk measure. We develop the first provably efficient RL algorithm tailored for this setting. We also prove by rigorous analysis that our algorithm achieves polynomial regret $\tilde{O}\left(\frac{e^{|{\gamma}|H}-1}{|{\gamma}|H}H^2\sqrt{KHS^2OA}\right)$, which outperforms or matches existing upper bounds when the model degenerates to risk-neutral or fully observable settings. We adopt the method of change-of-measure and develop a novel analytical tool of beta vectors to streamline mathematical derivations. These techniques are of particular interest to the theoretical study of reinforcement learning.}
    }

