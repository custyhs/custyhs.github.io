- id: liu2025interpolants
  title: "Finite-Time Analysis of Discrete-Time Stochastic Interpolants"
  authors: ["Yuhao Liu", "Yu Chen", "Rui Hu", "Longbo Huang"]
  year: 2025
  kind: publication
  venue: ICML
  venue_full: "Forty-second International Conference on Machine Learning"
  topics: [generative]
  links:
    - { label: Paper, url: "https://proceedings.mlr.press/v267/liu25d.html", kind: paper }
    - { label: arXiv, url: "https://arxiv.org/abs/2502.09130", kind: arxiv }
  bibtex: |
    @InProceedings{pmlr-v267-liu25d,
      title = 	 {Finite-Time Analysis of Discrete-Time Stochastic Interpolants},
      author =       {Liu, Yuhao and Chen, Yu and Hu, Rui and Huang, Longbo},
      booktitle = 	 {Proceedings of the 42nd International Conference on Machine Learning},
      pages = 	 {38119--38143},
      year = 	 {2025},
      editor = 	 {Singh, Aarti and Fazel, Maryam and Hsu, Daniel and Lacoste-Julien, Simon and Berkenkamp, Felix and Maharaj, Tegan and Wagstaff, Kiri and Zhu, Jerry},
      volume = 	 {267},
      series = 	 {Proceedings of Machine Learning Research},
      month = 	 {13--19 Jul},
      publisher =    {PMLR},
      pdf = 	 {https://raw.githubusercontent.com/mlresearch/v267/main/assets/liu25d/liu25d.pdf},
      url = 	 {https://proceedings.mlr.press/v267/liu25d.html},
      abstract = 	 {The stochastic interpolant framework offers a powerful approach for constructing generative models based on ordinary differential equations (ODEs) or stochastic differential equations (SDEs) to transform arbitrary data distributions. However, prior analyses of this framework have primarily focused on the continuous-time setting, assuming perfect solution of the underlying equations. In this work, we present the first discrete-time analysis of the stochastic interpolant framework, where we introduce a innovative discrete-time sampler and derive a finite-time upper bound on its distribution estimation error. Our result provides a novel quantification on how different factors, including the distance between source and target distributions and estimation accuracy, affect the convergence rate and also offers a new principled way to design efficient schedule for convergence acceleration. Finally, numerical experiments are conducted on the discrete-time sampler to corroborate our theoretical findings.}
    }

